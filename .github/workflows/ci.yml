  build-and-release-on-macos:
    runs-on: macos-latest
    needs: test
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust targets
      run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
    - name: Build x86_64 macOS
      run: cargo build --release --target x86_64-apple-darwin
    - name: Build aarch64 macOS
      run: cargo build --release --target aarch64-apple-darwin
    - name: release macos
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        files: |
          target/x86_64-apple-darwin/release/sarifup
          target/aarch64-apple-darwin/release/sarifup

  build-and-release-on-windows:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust target
      run: rustup target add x86_64-pc-windows-msvc
    - name: Build
      run: cargo build --release --target x86_64-pc-windows-msvc
    - name: release windows
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        files: target/x86_64-pc-windows-msvc/release/sarifup.exe
